<svg viewBox="0 0 1200 397" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wave UI themes — Graphite, Ink, Paper" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- A concept of the three themes, not a screenshot: one card per theme,
       drawn with the theme's real tokens (foundation, surface, contrast,
       muted, subtle, secondary, primary; edge, line and contour at 10/5/15%)
       and the real Card, Avatar, Separator and Button measurements. Corners
       use the plain radii (14px card, 10px button); an SVG rect can't draw
       the squircle. -->

  <!-- Graphite -->
  <g>
    <rect x="0" y="0" width="400" height="397" fill="#28292E"/>
    <rect x="40.5" y="56.5" width="319" height="236" rx="13.5" fill="#323339" stroke="#F3F3F4" stroke-opacity="0.1"/>
    <rect x="64" y="89" width="150" height="14" rx="7" fill="#F3F3F4"/>
    <circle cx="320" cy="96" r="16" fill="#4C4E56"/>
