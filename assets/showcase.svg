    <text x="186" y="256.6" text-anchor="middle" font-size="16" font-weight="500" fill="#F3F3F4">Outline</text>
    <text x="40" y="339" font-size="19" font-weight="700" fill="#F3F3F4">Graphite</text>
    <text x="40" y="361" font-size="12.5" fill="#B0B1B7">neutral · all-day</text>
  </g>

