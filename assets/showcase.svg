    <rect x="64" y="156" width="224" height="9" rx="4.5" fill="#B0B1B7"/>
    <rect x="64" y="176" width="248" height="9" rx="4.5" fill="#7D7E87"/>
    <line x1="41" y1="209.5" x2="359" y2="209.5" stroke="#F3F3F4" stroke-opacity="0.05"/>
    <rect x="64" y="233" width="74" height="36" rx="10" fill="#0074DE"/>
    <text x="101" y="256.6" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">Action</text>
