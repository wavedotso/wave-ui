name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: write # create release commits & tags
      pull-requests: write # open "Version Packages" PR
      id-token: write # OIDC for npm trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, so the release step can find each version's
          # release commit.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 is a current, safe baseline. Publishing is done by pnpm's
          # own native publisher below (not the npm CLI), so the old
          # "npm >= 11.5.1" constraint that forced 24 no longer strictly
          # applies — but keeping 24 is harmless and future-proof.
          node-version: 24
          cache: pnpm
          # Still required with OIDC: it writes the .npmrc that tells the
          # publisher which registry to authenticate against.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build library
        run: pnpm build

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN, deliberately. changesets/action checks
          # NPM_TOKEN first and only falls through to OIDC trusted publishing
          # when it is absent — so leaving it set would keep this job on the
          # token path and silently switch trusted publishing back off.
          #
          # ⚠️ This only works once a trusted publisher is configured for
          # @waveso/ui on npmjs.com (org `wavedotso`, repo `wave-ui`, workflow
          # `publish.yml`). Configure it and ship one release BEFORE relying on
          # this, or the publish fails auth.
          #
          # Not optional in the long run: npm is removing direct publishing from
          # 2FA-bypass granular tokens around January 2027, and OIDC is the
          # replacement npm points at.
          #
          # PNPM_CONFIG_PROVENANCE, not NPM_CONFIG_PROVENANCE: changesets routes
          # to pnpm's native publisher now that a pnpm lockfile exists, and
          # pnpm 11 renamed the env prefix. pnpm 11's native publish handles
          # OIDC trusted publishing — the early 11.0.8 breakage was fixed in
          # ~11.1.3 (pnpm/pnpm#11526); this repo pins pnpm 11.21.
          PNPM_CONFIG_PROVENANCE: true

      # changesets/action tags and releases only what it finds in the publish
      # output, and since the move to pnpm and @changesets/cli 3 it finds
      # nothing: 0.15.1 to 0.18.0 reached npm with no tag or GitHub Release.
      # So releases are made here, from what's actually on npm: every version
      # published since the newest GitHub Release that has no release yet gets
      # one, on the merge of the release PR that set that version (where the
      # publish ran), with its CHANGELOG section as the notes. That also
      # backfills any release a run missed. A no-op when nothing is missing, so
      # it is safe on every push, and if the action ever releases again.
      - name: Tag and release published versions
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }
          released=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          newest=$(echo "$released" | grep -E '^v[0-9]' | sed 's/^v//' | sort -V | tail -1)
          newest=${newest:-0.0.0}
          published=$(npm view @waveso/ui versions --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log([].concat(JSON.parse(s)).join("\n")))')
          latest=""
          for version in $(echo "$published" | sort -V); do
            newer "$version" "$newest" || continue
            echo "$released" | grep -qx "v$version" && continue
            # The "version packages" commit that set this version, then the
            # merge of its release PR, where the publish ran (fallback: itself).
            bump=$(git log --reverse --format=%H -G"\"version\": \"$version\"" HEAD -- package.json | head -1)
            if [ -z "$bump" ]; then
              echo "No commit sets version $version; skipped."
              continue
            fi
            commit=$(git log --merges --ancestry-path --reverse --format=%H "$bump..HEAD" | head -1)
            commit=${commit:-$bump}
            git show "$commit:CHANGELOG.md" | awk -v heading="## $version" '$0 == heading { found = 1; next } /^## / { if (found) exit } found' > release-notes.md
            # GitHub refuses this token a release that names a commit whose
            # workflow files differ from main's, even when the tag exists. So
            # an existing tag is used as it is, and only a commit that has no
            # tag yet is named: the run's own release commit, which matches
            # main. A release missed on an older commit needs its tag pushed
            # by hand first.
            target="--target=$commit"
            git rev-parse -q --verify "refs/tags/v$version" >/dev/null && target="--verify-tag"
            gh release create "v$version" $target --title "v$version" --notes-file release-notes.md --latest=false
            echo "Released v$version at ${commit:0:7}."
            latest=$version
          done
          if [ -n "$latest" ]; then
            gh release edit "v$latest" --latest
          fi
