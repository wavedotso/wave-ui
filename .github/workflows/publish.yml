name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: write # create release commits & tags
      pull-requests: write # open "Version Packages" PR
      id-token: write # OIDC for npm trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 24, not 22, and the version is load-bearing here rather than a
          # preference: npm trusted publishing needs npm >= 11.5.1, and Node 22
          # ships npm 10.9.8. On 22 the publish below cannot authenticate at all
          # once the token is gone. Node 24 ships 11.17.0.
          node-version: 24
          cache: npm
          # Still required with OIDC: it writes the .npmrc that tells npm which
          # registry to authenticate against.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint & format
        run: npx biome ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build library
        run: npm run build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN, deliberately. changesets/action checks
          # NPM_TOKEN first and only falls through to OIDC trusted publishing
          # when it is absent — so leaving it set would keep this job on the
          # token path and silently switch trusted publishing back off.
          #
          # ⚠️ This only works once a trusted publisher is configured for
          # @waveso/ui on npmjs.com (org `wavedotso`, repo `wave-ui`, workflow
          # `publish.yml`). Configure it and ship one release BEFORE this line
          # is removed, or the next publish fails with a 401.
          #
          # Not optional in the long run: npm is removing direct publishing from
          # 2FA-bypass granular tokens around January 2027, and OIDC is the
          # replacement npm points at.
          #
          # `NPM_CONFIG_*` is correct while this repo is on npm. It becomes
          # `PNPM_CONFIG_PROVENANCE` in the pnpm migration and not before —
          # pnpm 11 renamed the prefix, and changesets routes to `pnpm publish`
          # the moment a pnpm lockfile exists, so getting the order wrong drops
          # provenance with no error.
          NPM_CONFIG_PROVENANCE: true
